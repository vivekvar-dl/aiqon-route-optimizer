name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[demo,test]"
      - run: python -m pytest -q
      - name: Verify seeded artifacts
        run: |
          python -m routeplan generate --seed 7 --shipments 30 > /tmp/shipments.json
          cmp data/shipments.json /tmp/shipments.json
          python scripts/run_evaluation.py
          python scripts/run_robustness.py
          git diff --exit-code -- results/evaluation.json results/robustness.json
